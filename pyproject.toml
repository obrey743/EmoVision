[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emovision"
version = "0.2.0"
description = "Real-time facial emotion recognition with OpenCV and TensorFlow/Keras"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "tensorflow>=2.17",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emovision-collect = "emovision.data.collector:main"
emovision-train = "emovision.train:main"
emovision-infer = "emovision.infer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
